name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # FID + training are too heavy for CI (PLAN.md "Testing strategy"): install only the
      # dev tooling and run ruff + the mechanics tests. No torch/torchvision/gradio here.
      - name: Install dev tooling
        run: python -m pip install ruff pytest

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
