name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The mechanics tests (shapes + a single train step) need torch but run fast on
      # CPU. FID/training stay out of CI per PLAN.md "Testing strategy", so we install
      # CPU-only torch + numpy and skip the heavier torchvision/torchmetrics/gradio.
      - name: Install dev tooling
        run: |
          python -m pip install ruff pytest numpy
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
