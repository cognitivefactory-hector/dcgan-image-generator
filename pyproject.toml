[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dcgan-image-generator"
version = "0.1.0"
description = "A Deep Convolutional GAN trained from scratch in PyTorch, with honest training instrumentation (FID, fixed-noise grids, loss curves)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Hector Garza", email = "hectorg@smartxchain.com" }]

# Core ML + demo stack (SPEC.md §6). Heavy; not installed in CI (see .github/workflows/ci.yml).
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "torchmetrics>=1.3",
    "gradio>=4.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# pycodestyle errors/warnings, pyflakes, isort, pyupgrade, bugbear
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
